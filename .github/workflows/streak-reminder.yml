name: Pengingat streak

on:
  schedule:
    # Cadangan saja: jadwal GitHub sering molor berjam-jam. Pemicu utama = cron-job.org memanggil
    # workflow_dispatch tiap 15 menit (lihat README, bagian Notifikasi streak).
    - cron: '*/15 * * * *'
  workflow_dispatch: {}   # dipanggil cron-job.org, atau manual dari tab Actions

permissions:
  contents: read

concurrency:
  group: streak-reminder
  cancel-in-progress: false

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/scripts
            js/core/reminderText.js
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Kirim notifikasi
        working-directory: .github/scripts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "Secret FIREBASE_SERVICE_ACCOUNT belum diisi, dilewati."
            exit 0
          fi
          cp ../../js/core/reminderText.js ./reminderText.mjs
          npm install --no-save --no-audit --no-fund firebase-admin@12 web-push@3
          node streak-reminder.mjs
